<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Buku Kas Piutang & Hutang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Gaya Tampilan Ala Mobile Native App */
        body {
            background-color: #0f172a; /* Latar belakang luar ala bingkai device */
            color: #1e293b;
        }
        .mobile-container {
            max-width: 480px;
            min-height: 100vh;
            background-color: #f8fafc;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        /* Sembunyikan scrollbar tapi tetap bisa di-scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Tombol Pengaturan 3D */
        .settings-btn-3d {
            background: linear-gradient(135deg, #333333 0%, #111111 100%);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.15s ease;
        }
        .settings-btn-3d.active {
            background: linear-gradient(135deg, #d1d5db 0%, #9ca3af 100%) !important;
            color: #374151 !important;
            box-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.3) !important;
        }
    </style>
</head>
<body class="font-sans select-none flex justify-center items-start min-h-screen m-0 p-0">

    <!-- Container Utama (Membatasi lebar seperti layar HP) -->
    <div class="mobile-container w-full relative flex flex-col pb-28">
        
        <!-- Header Mobile Profesional -->
        <header class="sticky top-0 bg-white/95 backdrop-blur-md px-4 py-3.5 border-b border-slate-100 flex items-center justify-between gap-3 z-30 shadow-xs">
            <div class="flex items-center gap-3 min-w-0">
                <!-- Tombol Menu Pengaturan (Hamburger) -->
                <div class="relative shrink-0">
                    <button type="button" id="btnMenuAkun" onclick="toggleMenuAksiAkun(event)" class="bg-slate-900 hover:bg-black text-white p-2.5 rounded-xl text-sm transition cursor-pointer flex items-center justify-center shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 stroke-[2]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>

                    <!-- Menu Dropdown Utama -->
                    <div id="menuAksiAkun" class="hidden absolute left-0 mt-2 w-72 bg-white border border-slate-100 rounded-2xl shadow-2xl z-50 p-3 space-y-2">
                        <div class="text-[11px] font-bold text-slate-400 px-3 py-1 uppercase tracking-wider border-b border-slate-100">Pengaturan Akun</div>
                        
                        <div class="relative">
                            <button type="button" onclick="toggleSubMenuAkun(event)" class="w-full text-left px-3 py-2.5 text-xs font-semibold text-slate-700 bg-slate-50 hover:bg-blue-50 hover:text-blue-700 rounded-xl transition flex items-center justify-between gap-2 cursor-pointer border border-slate-200">
                                <span class="truncate">📂 Akun: <span id="labelAkunDiMenu" class="text-blue-600 font-bold">Nama Akun</span></span>
                                <span class="text-slate-400">▾</span>
                            </button>

                            <div id="subMenuGantiAkun" class="hidden mt-1 pl-2 space-y-1 max-h-40 overflow-y-auto border-l-2 border-blue-200">
                                <div id="daftarPilihanAkun" class="space-y-1"></div>
                            </div>
                        </div>

                        <button type="button" onclick="editNamaAkun()" class="w-full text-left px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-100 rounded-xl transition flex items-center gap-2 cursor-pointer">
                            ✏️ Ubah Nama Akun Ini
                        </button>
                        <button type="button" onclick="hapusAkunAktif()" class="w-full text-left px-3 py-2 text-xs font-semibold text-rose-600 hover:bg-rose-50 rounded-xl transition flex items-center gap-2 cursor-pointer">
                            🗑️ Reset / Hapus Akun
                        </button>
                    </div>
                </div>

                <!-- Informasi Akun -->
                <div class="flex flex-col min-w-0">
                    <h1 id="judulAkunAktif" class="text-sm font-bold text-slate-900 truncate">Pencatatan Piutang Toko</h1>
                    <span class="text-[11px] text-emerald-600 font-medium flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Online Real-Time
                    </span>
                </div>
            </div>

            <!-- Tombol Refresh Sinkronisasi -->
            <button type="button" onclick="muatDataDariServer()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-2.5 rounded-xl transition cursor-pointer flex items-center justify-center" title="Sinkronkan">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </header>

        <!-- KONTEN UTAMA APLIKASI -->
        <main class="p-4 flex-1 space-y-4">
            
            <!-- KARTU RINGKASAN KEUANGAN MOBILE -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gradient-to-br from-rose-500 to-rose-600 text-white p-3.5 rounded-2xl shadow-md shadow-rose-500/20">
                    <p class="text-[10px] uppercase tracking-wider text-rose-100 font-medium">Total Piutang</p>
                    <p id="valTotalPiutangSaja" class="text-lg font-extrabold mt-1 truncate">Rp 0</p>
                </div>
                <div class="bg-gradient-to-br from-blue-500 to-blue-600 text-white p-3.5 rounded-2xl shadow-md shadow-blue-500/20">
                    <p class="text-[10px] uppercase tracking-wider text-blue-100 font-medium">Total Hutang</p>
                    <p id="valTotalHutangSaja" class="text-lg font-extrabold mt-1 truncate">Rp 0</p>
                </div>
            </div>

            <!-- FORM: PIUTANG (Popup/Inline Mobile Card) -->
            <div id="containerFormPiutang" class="hidden p-4 shadow-xl bg-rose-50 border-2 border-rose-500 rounded-2xl transition-all">
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-rose-200">
                    <h2 class="text-sm font-bold text-rose-900">📗 Catat Piutang Baru</h2>
                    <button type="button" onclick="tutupForm()" class="text-rose-700 font-bold text-xs p-1">✕ Tutup</button>
                </div>
                <form id="formPiutang" onsubmit="simpanTransaksiOnline(event, 'Piutang')" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">Tanggal</label>
                        <input type="date" id="tanggalPiutang" required class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs shadow-xs focus:ring-2 focus:ring-rose-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">Nama Pihak / Debitur</label>
                        <input type="text" id="namaPiutang" required placeholder="Contoh: Bpk. Budi" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs shadow-xs focus:ring-2 focus:ring-rose-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">Nominal (Rp)</label>
                        <input type="text" id="jumlahPiutang" inputmode="numeric" required placeholder="Rp 500.000" oninput="formatInputRupiah(this)" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs font-bold shadow-xs focus:ring-2 focus:ring-rose-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">Keterangan</label>
                        <input type="text" id="keteranganPiutang" placeholder="Contoh: Belanja warung" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs shadow-xs focus:ring-2 focus:ring-rose-500 outline-none">
                    </div>
                    <button type="submit" id="btnSubmitPiutang" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-semibold py-2.5 rounded-xl text-xs shadow-md transition cursor-pointer mt-1">Simpan Piutang</button>
                </form>
            </div>

            <!-- FORM: HUTANG -->
            <div id="containerFormHutang" class="hidden p-4 shadow-xl bg-blue-50 border-2 border-blue-500 rounded-2xl transition-all">
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-blue-200">
                    <h2 class="text-sm font-bold text-blue-900">📕 Catat Hutang Baru</h2>
                    <button type="button" onclick="tutupForm()" class="text-blue-700 font-bold text-xs p-1">✕ Tutup</button>
                </div>
                <form id="formHutang" onsubmit="simpanTransaksiOnline(event, 'Hutang')" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">Tanggal</label>
                        <input type="date" id="tanggalHutang" required class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs shadow-xs focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">Nama Pihak / Kreditur</label>
                        <input type="text" id="namaHutang" required placeholder="Contoh: Supplier Barang" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs shadow-xs focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">Nominal (Rp)</label>
                        <input type="text" id="jumlahHutang" inputmode="numeric" required placeholder="Rp 1.000.000" oninput="formatInputRupiah(this)" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs font-bold shadow-xs focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">Keterangan</label>
                        <input type="text" id="keteranganHutang" placeholder="Contoh: Ambil stok dagangan" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs shadow-xs focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <button type="submit" id="btnSubmitHutang" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-xs shadow-md transition cursor-pointer mt-1">Simpan Hutang</button>
                </form>
            </div>

            <!-- TABEL & FILTER SECTION -->
            <div class="bg-white border border-slate-200 rounded-2xl shadow-xs overflow-hidden">
                <!-- Filter & Pengurutan Bar -->
                <div class="p-3 border-b border-slate-100 flex items-center justify-between gap-2 bg-slate-50">
                    <div id="filterContainer" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
                    
                    <!-- Tombol Pengaturan Urutkan 3D -->
                    <div class="relative shrink-0">
                        <button type="button" id="settingsBtn" onclick="toggleSettingsPopup(event)" class="settings-btn-3d text-white w-9 h-9 rounded-xl flex items-center justify-center cursor-pointer shadow-sm" title="Pengaturan Urutkan">
                            <svg class="w-4 h-4 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                            </svg>
                        </button>

                        <!-- Pop-up Pengaturan Tabel -->
                        <div id="settingsPopup" class="hidden absolute right-0 mt-2 w-64 bg-white border border-slate-200 rounded-2xl shadow-2xl z-50 p-3">
                            <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-100">
                                <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Urutkan Data</h3>
                                <button type="button" onclick="tutupSettingsPopup()" class="text-slate-400 font-bold text-xs">✕</button>
                            </div>
                            <div class="space-y-1">
                                <button type="button" onclick="pilihOpsiUrutkan('date-desc')" id="sortDateDesc" class="w-full text-left px-2.5 py-2 text-xs rounded-xl transition cursor-pointer hover:bg-slate-100 text-slate-700">📅 Tanggal Terbaru</button>
                                <button type="button" onclick="pilihOpsiUrutkan('date-asc')" id="sortDateAsc" class="w-full text-left px-2.5 py-2 text-xs rounded-xl transition cursor-pointer hover:bg-slate-100 text-slate-700">📆 Tanggal Terlama</button>
                                <button type="button" onclick="pilihOpsiUrutkan('input-desc')" id="sortInputDesc" class="w-full text-left px-2.5 py-2 text-xs rounded-xl transition cursor-pointer hover:bg-slate-100 text-slate-700">📥 Pencatatan Terbaru</button>
                                <button type="button" onclick="pilihOpsiUrutkan('input-asc')" id="sortInputAsc" class="w-full text-left px-2.5 py-2 text-xs rounded-xl transition cursor-pointer hover:bg-slate-100 text-slate-700">📤 Pencatatan Terlama</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabel Data Transaksi Responsive -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-100 text-slate-500 uppercase text-[10px] tracking-wider">
                                <th class="p-2.5 w-12 text-center">Pilih</th>
                                <th class="p-2.5">Tanggal</th>
                                <th class="p-2.5">Nama Pihak</th>
                                <th class="p-2.5">Jenis</th>
                                <th class="p-2.5">Jumlah</th>
                                <th class="p-2.5">Ket</th>
                                <th class="p-2.5">Status</th>
                                <th class="p-2.5 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelData" class="divide-y divide-slate-100">
                            <tr><td colspan="8" class="p-6 text-center text-slate-400 italic">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

        <!-- BOTTOM NAVIGATION BAR (Gaya Aplikasi Mobile Professional) -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-3 py-2 flex items-center justify-around z-30 shadow-lg">
            <button onclick="setFilter('Semua'); tutupForm();" class="flex flex-col items-center text-slate-600 hover:text-blue-600 transition cursor-pointer">
                <span class="text-lg">🏠</span>
                <span class="text-[10px] font-semibold mt-0.5">Semua</span>
            </button>
            <button onclick="bukaFormPiutang('Piutang')" class="flex flex-col items-center text-rose-600 hover:text-rose-700 transition cursor-pointer">
                <span class="text-lg">📗</span>
                <span class="text-[10px] font-semibold mt-0.5">+ Piutang</span>
            </button>
            <button onclick="bukaFormPiutang('Hutang')" class="flex flex-col items-center text-blue-600 hover:text-blue-700 transition cursor-pointer">
                <span class="text-lg">📕</span>
                <span class="text-[10px] font-semibold mt-0.5">+ Hutang</span>
            </button>
            <button onclick="toggleMenuAksiAkun(event)" class="flex flex-col items-center text-slate-600 hover:text-slate-900 transition cursor-pointer">
                <span class="text-lg">⚙️</span>
                <span class="text-[10px] font-semibold mt-0.5">Akun</span>
            </button>
        </nav>

        <!-- MODAL / POPUP DETAIL TRANSAKSI -->
        <div id="modalDetail" style="display: none;" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
            <div id="kotakKontenDetail" class="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-slate-200 transition-all">
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                    <h3 id="judulModalDetail" class="text-sm font-bold text-slate-900">📋 Detail Transaksi</h3>
                    <button type="button" onclick="tutupModalDetailManual()" class="text-slate-400 hover:text-slate-700 font-bold text-base px-2">✕</button>
                </div>
                <div id="kontenDetailTransaksi" class="space-y-2 text-xs mb-5"></div>
                <div id="aksiDetailTransaksi" class="flex flex-wrap gap-2 justify-end items-center"></div>
            </div>
        </div>
